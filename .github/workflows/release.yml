name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
          cache-dependency-path: go.sum
      
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
      
      - name: Validate version format
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version must be in format vX.Y.Z (e.g., v1.0.0)"
            exit 1
          fi
          echo "Valid version: $VERSION"
      
      - name: Download dependencies
        run: go mod download
      
      - name: Run tests
        run: go test -v ./...
      
      - name: Build
        run: go build ./...
      
      - name: Create tag if workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"
      
      - name: Generate changelog
        id: changelog
        uses: metcalfc/changelog-generator@v4.3.0
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## Release ${{ steps.version.outputs.version }}
            
            ${{ steps.changelog.outputs.changelog }}
            
            ## Installation
            
            ```bash
            go get github.com/tcbtcn/cross-chain-sdk-go@${{ steps.version.outputs.version }}
            ```
            
            ## Documentation
            
            Documentation is available at: https://pkg.go.dev/github.com/tcbtcn/cross-chain-sdk-go@${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true

  publish:
    name: Publish to pkg.go.dev
    runs-on: ubuntu-latest
    needs: release
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
      
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
      
      - name: Verify module
        run: |
          go mod verify
          go list -m -versions github.com/tcbtcn/cross-chain-sdk-go
      
      - name: Trigger pkg.go.dev indexing
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Triggering pkg.go.dev indexing for version: $VERSION"
          curl -X POST "https://proxy.golang.org/github.com/tcbtcn/cross-chain-sdk-go/@v/$VERSION.info"
      
      - name: Wait for indexing
        run: |
          echo "Waiting for pkg.go.dev to index the package..."
          echo "Package will be available at: https://pkg.go.dev/github.com/tcbtcn/cross-chain-sdk-go@${{ steps.version.outputs.version }}"
          echo "Note: It may take a few minutes for the package to appear on pkg.go.dev"
